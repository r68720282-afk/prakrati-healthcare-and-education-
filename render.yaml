services:
  - type: web
    name: prakarati-server
    runtime: node
    rootDir: server
    buildCommand: npm ci || npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://prakarati-frontend.onrender.com
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: static
    name: prakarati-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build || (npm install && npm run build)
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://prakarati-server.onrender.com/api
